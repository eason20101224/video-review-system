<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>视频审阅 - 管理后台</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #333; }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    /* 登录页 */
    .login-box {
      max-width: 400px;
      margin: 100px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }
    .login-box h2 { margin-bottom: 20px; text-align: center; }
    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .login-btn {
      width: 100%;
      padding: 12px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    /* 后台面板 */
    .admin-panel { display: none; }
    .header {
      background: white;
      padding: 16px 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header h2 { font-size: 18px; }
    .logout-btn {
      padding: 8px 16px;
      background: #6b7280;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    /* 标签页 */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .tab {
      padding: 10px 18px;
      background: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      color: #666;
    }
    .tab.active {
      background: #3b82f6;
      color: white;
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .section {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .section h3 {
      margin-bottom: 16px;
      font-size: 16px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      align-items: center;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .form-row label {
      width: 140px;
      font-size: 14px;
      color: #555;
      flex-shrink: 0;
    }
    .form-row input, .form-row textarea, .form-row select {
      flex: 1;
      min-width: 200px;
      padding: 8px 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      font-family: inherit;
    }
    .form-row textarea { min-height: 80px; resize: vertical; }

    .btn {
      padding: 8px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-primary { background: #3b82f6; color: white; }
    .btn-green { background: #22c55e; color: white; }
    .btn-red { background: #ef4444; color: white; }
    .btn-gray { background: #6b7280; color: white; }

    /* 数据概览卡片 */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .stat-card .label { font-size: 13px; color: #666; margin-bottom: 8px; }
    .stat-card .value { font-size: 24px; font-weight: 600; }
    .stat-card.like .value { color: #22c55e; }
    .stat-card.dislike .value { color: #ef4444; }

    /* 表格 */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      padding: 10px 12px;
      text-align: left;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    th { background: #f9fafb; font-weight: 600; }
    .table-wrap {
      max-height: 350px;
      overflow-y: auto;
      margin: 10px 0;
    }

    .poll-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .poll-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }

    .switch-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-size: 13px;
    }
    .switch-btn.on { background: #dcfce7; color: #166534; }
    .switch-btn.off { background: #fee2e2; color: #991b1b; }

    @media (max-width: 768px) {
      .container { padding: 12px; }
      .stats-row { grid-template-columns: 1fr; }
      .form-row label { width: 100%; }
      .form-row input, .form-row textarea { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录框 -->
    <div class="login-box" id="loginBox">
      <h2>管理后台登录</h2>
      <input type="password" id="passwordInput" placeholder="请输入管理员密码">
      <button class="login-btn" id="loginBtn">登录</button>
    </div>

    <!-- 管理面板 -->
    <div class="admin-panel" id="adminPanel">
      <div class="header">
        <h2>视频审阅数据后台</h2>
        <button class="logout-btn" onclick="logout()">退出登录</button>
      </div>

      <!-- 标签页 -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab(1)">项目配置</button>
        <button class="tab" onclick="switchTab(2)">内容配置</button>
        <button class="tab" onclick="switchTab(3)">反馈数据</button>
        <button class="tab" onclick="switchTab(4)">评价数据</button>
      </div>

      <!-- 标签1：项目配置 -->
      <div class="tab-content active" id="tab1">
        <div class="section">
          <h3>基础信息配置</h3>
          <div class="form-row">
            <label>项目名称</label>
            <input type="text" id="cfg_project_name">
          </div>
          <div class="form-row">
            <label>截止时间</label>
            <input type="datetime-local" id="cfg_deadline">
          </div>
          <div class="form-row">
            <label>反馈状态</label>
            <button class="switch-btn on" id="feedbackSwitch" onclick="toggleFeedback()">已开启</button>
          </div>
        </div>

        <div class="section">
          <h3>资源配置（七牛云链接）</h3>
          <div class="form-row">
            <label>视频链接</label>
            <input type="text" id="cfg_video_url" placeholder="粘贴视频外链">
          </div>
          <div class="form-row">
            <label>标题1</label>
            <input type="text" id="cfg_title1">
          </div>
          <div class="form-row">
            <label>标题2</label>
            <input type="text" id="cfg_title2">
          </div>
          <div class="form-row">
            <label>封面1链接</label>
            <input type="text" id="cfg_cover1" placeholder="粘贴封面图片外链">
          </div>
          <div class="form-row">
            <label>封面2链接</label>
            <input type="text" id="cfg_cover2" placeholder="粘贴封面图片外链">
          </div>
          <button class="btn btn-primary" onclick="saveProjectConfig()">保存项目配置</button>
        </div>

        <div class="section">
          <h3>管理员密码修改</h3>
          <div class="form-row">
            <label>新密码</label>
            <input type="text" id="newPassword" placeholder="输入新密码">
          </div>
          <button class="btn btn-gray" onclick="changePassword()">修改密码</button>
        </div>
      </div>

      <!-- 标签2：内容配置 -->
      <div class="tab-content" id="tab2">
        <div class="section">
          <h3>使用说明配置</h3>
          <div class="form-row">
            <label>说明标题</label>
            <input type="text" id="cfg_guide_title">
          </div>
          <div class="form-row">
            <label>说明正文</label>
            <textarea id="cfg_guide_content"></textarea>
          </div>
        </div>

        <div class="section">
          <h3>表单全局配置</h3>
          <div class="form-row">
            <label>表单标题</label>
            <input type="text" id="cfg_form_title">
          </div>
          <div class="form-row">
            <label>表单描述</label>
            <input type="text" id="cfg_form_desc">
          </div>
        </div>

        <div class="section">
          <h3>题目配置</h3>
          <div class="form-row">
            <label>第1题标题</label>
            <input type="text" id="cfg_q1_title">
          </div>
          <div class="form-row">
            <label>维度1名称</label>
            <input type="text" id="cfg_q1_dim1">
          </div>
          <div class="form-row">
            <label>维度2名称</label>
            <input type="text" id="cfg_q1_dim2">
          </div>
          <div class="form-row">
            <label>维度3名称</label>
            <input type="text" id="cfg_q1_dim3">
          </div>
          <div class="form-row">
            <label>维度4名称</label>
            <input type="text" id="cfg_q1_dim4">
          </div>
          <div class="form-row">
            <label>维度5名称</label>
            <input type="text" id="cfg_q1_dim5">
          </div>

          <div class="form-row" style="margin-top:20px;">
            <label>第2题标题</label>
            <input type="text" id="cfg_q2_title">
          </div>
          <div class="form-row">
            <label>低分原因选项(JSON)</label>
            <textarea id="cfg_q2_reasons" style="font-family: monospace; font-size:12px;"></textarea>
          </div>

          <div class="form-row" style="margin-top:20px;">
            <label>第3题标题</label>
            <input type="text" id="cfg_q3_title">
          </div>
          <div class="form-row">
            <label>选项3文字</label>
            <input type="text" id="cfg_q3_opt3">
          </div>
          <div class="form-row">
            <label>选项4文字</label>
            <input type="text" id="cfg_q3_opt4">
          </div>
          <div class="form-row">
            <label>其他输入提示</label>
            <input type="text" id="cfg_q3_other_placeholder">
          </div>

          <div class="form-row" style="margin-top:20px;">
            <label>第4题标题</label>
            <input type="text" id="cfg_q4_title">
          </div>
          <div class="form-row">
            <label>选项3文字</label>
            <input type="text" id="cfg_q4_opt3">
          </div>
          <div class="form-row">
            <label>选项4文字</label>
            <input type="text" id="cfg_q4_opt4">
          </div>
          <div class="form-row">
            <label>其他输入提示</label>
            <input type="text" id="cfg_q4_other_placeholder">
          </div>

          <div class="form-row" style="margin-top:20px;">
            <label>第5题标题</label>
            <input type="text" id="cfg_q5_title">
          </div>
          <div class="form-row">
            <label>输入框提示</label>
            <input type="text" id="cfg_q5_placeholder">
          </div>
          
          <button class="btn btn-primary" onclick="saveContentConfig()">保存全部内容配置</button>
        </div>
      </div>

      <!-- 标签3：反馈数据 -->
      <div class="tab-content" id="tab3">
        <div class="stats-row">
          <div class="stat-card">
            <div class="label">总反馈次数</div>
            <div class="value" id="totalCount">0</div>
          </div>
          <div class="stat-card like">
            <div class="label">最好看点</div>
            <div class="value" id="bestPoint">-</div>
          </div>
          <div class="stat-card dislike">
            <div class="label">最难看点</div>
            <div class="value" id="worstPoint">-</div>
          </div>
<div class="section">
  <h3>数据重置操作</h3>
  <p style="color:#999;font-size:13px;margin-bottom:12px;">⚠️ 危险操作：会删除所有用户反馈、所有答卷记录；不会删除表单配置和管理员密码，操作不可恢复，建议先导出CSV备份！</p>
  <button class="btn btn-red" onclick="clearAllBusinessData()">清空全部反馈+答卷数据</button>
</div>
        </div>

        <div class="section">
          <h3>秒级明细数据</h3>
          <button class="btn btn-green" onclick="exportFeedbackCSV()">导出 CSV 表格</button>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>视频秒数</th>
                  <th>好看人数</th>
                  <th>不好看人数</th>
                </tr>
              </thead>
              <tbody id="feedbackTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- 标签4：评价数据 -->
      <div class="tab-content" id="tab4">
        <div class="stats-row">
          <div class="stat-card">
            <div class="label">有效评价数</div>
            <div class="value" id="answerCount">0</div>
          </div>
          <div class="stat-card">
            <div class="label">平均作答时长</div>
            <div class="value" id="avgDuration">-</div>
          </div>
          <div class="stat-card like">
            <div class="label">整体平均分</div>
            <div class="value" id="avgScore">-</div>
          </div>
        </div>

        <div class="section">
          <h3>各维度平均分</h3>
          <div id="scoreStats"></div>
        </div>

        <div class="section">
          <h3>标题投票统计</h3>
          <div id="titlePollStats"></div>
        </div>

        <div class="section">
          <h3>封面投票统计</h3>
          <div id="coverPollStats"></div>
        </div>

        <div class="section">
          <h3>用户建议汇总</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>提交时间</th>
                  <th>建议内容</th>
                </tr>
              </thead>
              <tbody id="suggestionTable"></tbody>
            </table>
          </div>
        </div>

        <div class="section">
          <h3>数据导出</h3>
          <button class="btn btn-green" onclick="exportAnswersCSV()">导出全部评价数据 CSV</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ========== 仅修改这两项配置 ==========
    const SUPABASE_URL = 'https://gbosdkzcbqhrfsiqlbdf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_9O4JqSBGphBwASfl8YKvxA__gQvXizO';
    // =====================================

    window.supabaseClient = window.supabaseClient || window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    var supabase = window.supabaseClient;
    let feedbackSummary = [];
    let answersData = [];

    // 登录
    window.login = async function login() {
      const pwd = document.getElementById('passwordInput').value;
      const { data } = await supabase
        .from('admin_config')
        .select('value')
        .eq('key', 'admin_password')
        .single();
      
      if (data && data.value === pwd) {
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('adminPanel').style.display = 'block';
        loadAllConfig();
        loadFeedbackData();
        loadAnswersData();
      } else {
        alert('密码错误');
      }
    }

    window.logout = function logout() {
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('passwordInput').value = '';
    }

    // 切换标签
    function switchTab(num) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      document.querySelectorAll('.tab')[num-1].classList.add('active');
      document.getElementById('tab' + num).classList.add('active');
    }

    // 加载所有配置
    async function loadAllConfig() {
      const { data } = await supabase.from('form_config').select('*');
      const config = {};
      data.forEach(item => config[item.key] = item.value);

      // 填充项目配置
      document.getElementById('cfg_project_name').value = config.project_name || '';
      document.getElementById('cfg_deadline').value = config.deadline ? config.deadline.replace(' ', 'T').slice(0,16) : '';
      document.getElementById('cfg_video_url').value = config.video_url || '';
      document.getElementById('cfg_title1').value = config.title1 || '';
      document.getElementById('cfg_title2').value = config.title2 || '';
      document.getElementById('cfg_cover1').value = config.cover1 || '';
      document.getElementById('cfg_cover2').value = config.cover2 || '';

      // 反馈开关状态
      const btn = document.getElementById('feedbackSwitch');
      if (config.feedback_enabled === 'true') {
        btn.className = 'switch-btn on';
        btn.textContent = '已开启';
      } else {
        btn.className = 'switch-btn off';
        btn.textContent = '已暂停';
      }

      // 填充内容配置
      document.getElementById('cfg_guide_title').value = config.guide_title || '';
      document.getElementById('cfg_guide_content').value = config.guide_content || '';
      document.getElementById('cfg_form_title').value = config.form_title || '';
      document.getElementById('cfg_form_desc').value = config.form_desc || '';
      document.getElementById('cfg_q1_title').value = config.q1_title || '';
      document.getElementById('cfg_q1_dim1').value = config.q1_dim1 || '';
      document.getElementById('cfg_q1_dim2').value = config.q1_dim2 || '';
      document.getElementById('cfg_q1_dim3').value = config.q1_dim3 || '';
      document.getElementById('cfg_q1_dim4').value = config.q1_dim4 || '';
      document.getElementById('cfg_q1_dim5').value = config.q1_dim5 || '';
      document.getElementById('cfg_q2_title').value = config.q2_title || '';
      document.getElementById('cfg_q2_reasons').value = config.q2_reasons || '';
      document.getElementById('cfg_q3_title').value = config.q3_title || '';
      document.getElementById('cfg_q3_opt3').value = config.q3_opt3 || '';
      document.getElementById('cfg_q3_opt4').value = config.q3_opt4 || '';
      document.getElementById('cfg_q3_other_placeholder').value = config.q3_other_placeholder || '';
      document.getElementById('cfg_q4_title').value = config.q4_title || '';
      document.getElementById('cfg_q4_opt3').value = config.q4_opt3 || '';
      document.getElementById('cfg_q4_opt4').value = config.q4_opt4 || '';
      document.getElementById('cfg_q4_other_placeholder').value = config.q4_other_placeholder || '';
      document.getElementById('cfg_q5_title').value = config.q5_title || '';
      document.getElementById('cfg_q5_placeholder').value = config.q5_placeholder || '';
    }

    // 切换反馈开关
    async function toggleFeedback() {
      const btn = document.getElementById('feedbackSwitch');
      const isOn = btn.textContent === '已开启';
      const newValue = isOn ? 'false' : 'true';

      await supabase.from('form_config').update({ value: newValue }).eq('key', 'feedback_enabled');
      
      if (newValue === 'true') {
        btn.className = 'switch-btn on';
        btn.textContent = '已开启';
      } else {
        btn.className = 'switch-btn off';
        btn.textContent = '已暂停';
      }
      alert('保存成功');
    }

    // 保存项目配置
    async function saveProjectConfig() {
      const updates = [
        { key: 'project_name', value: document.getElementById('cfg_project_name').value },
        { key: 'deadline', value: document.getElementById('cfg_deadline').value.replace('T', ' ') + ':00' },
        { key: 'video_url', value: document.getElementById('cfg_video_url').value },
        { key: 'title1', value: document.getElementById('cfg_title1').value },
        { key: 'title2', value: document.getElementById('cfg_title2').value },
        { key: 'cover1', value: document.getElementById('cfg_cover1').value },
        { key: 'cover2', value: document.getElementById('cfg_cover2').value }
      ];

      for (const item of updates) {
        await supabase.from('form_config').update({ value: item.value }).eq('key', item.key);
      }
      alert('项目配置保存成功，观众端实时生效');
    }

    // 保存内容配置
    async function saveContentConfig() {
      const updates = [
        { key: 'guide_title', value: document.getElementById('cfg_guide_title').value },
        { key: 'guide_content', value: document.getElementById('cfg_guide_content').value },
        { key: 'form_title', value: document.getElementById('cfg_form_title').value },
        { key: 'form_desc', value: document.getElementById('cfg_form_desc').value },
        { key: 'q1_title', value: document.getElementById('cfg_q1_title').value },
        { key: 'q1_dim1', value: document.getElementById('cfg_q1_dim1').value },
        { key: 'q1_dim2', value: document.getElementById('cfg_q1_dim2').value },
        { key: 'q1_dim3', value: document.getElementById('cfg_q1_dim3').value },
        { key: 'q1_dim4', value: document.getElementById('cfg_q1_dim4').value },
        { key: 'q1_dim5', value: document.getElementById('cfg_q1_dim5').value },
        { key: 'q2_title', value: document.getElementById('cfg_q2_title').value },
        { key: 'q2_reasons', value: document.getElementById('cfg_q2_reasons').value },
        { key: 'q3_title', value: document.getElementById('cfg_q3_title').value },
        { key: 'q3_opt3', value: document.getElementById('cfg_q3_opt3').value },
        { key: 'q3_opt4', value: document.getElementById('cfg_q3_opt4').value },
        { key: 'q3_other_placeholder', value: document.getElementById('cfg_q3_other_placeholder').value },
        { key: 'q4_title', value: document.getElementById('cfg_q4_title').value },
        { key: 'q4_opt3', value: document.getElementById('cfg_q4_opt3').value },
        { key: 'q4_opt4', value: document.getElementById('cfg_q4_opt4').value },
        { key: 'q4_other_placeholder', value: document.getElementById('cfg_q4_other_placeholder').value },
        { key: 'q5_title', value: document.getElementById('cfg_q5_title').value },
        { key: 'q5_placeholder', value: document.getElementById('cfg_q5_placeholder').value }
      ];

      for (const item of updates) {
        await supabase.from('form_config').update({ value: item.value }).eq('key', item.key);
      }
      alert('内容配置保存成功，观众端实时生效');
    }

    // 修改管理员密码
    async function changePassword() {
      const newPwd = document.getElementById('newPassword').value.trim();
      if (!newPwd) { alert('请输入新密码'); return; }
      await supabase.from('admin_config').update({ value: newPwd }).eq('key', 'admin_password');
      alert('密码修改成功');
      document.getElementById('newPassword').value = '';
    }

    // 加载反馈数据
    async function loadFeedbackData() {
      const { data } = await supabase
        .from('feedback')
        .select('*')
        .eq('video_id', 'default');
      
      if (!data || data.length === 0) return;

      // 按秒统计
      const maxSecond = Math.max(...data.map(i => Math.floor(i.time)));
      const likeMap = {}, dislikeMap = {};
      
      for (let i = 0; i <= maxSecond; i++) {
        likeMap[i] = 0;
        dislikeMap[i] = 0;
      }
      
      data.forEach(item => {
        const s = Math.floor(item.time);
        item.type === 'like' ? likeMap[s]++ : dislikeMap[s]++;
      });

      feedbackSummary = [];
      let maxLike = 0, maxLikeSec = 0;
      let maxDislike = 0, maxDislikeSec = 0;

      for (let i = 0; i <= maxSecond; i++) {
        feedbackSummary.push({ second: i, like: likeMap[i], dislike: dislikeMap[i] });
        if (likeMap[i] > maxLike) { maxLike = likeMap[i]; maxLikeSec = i; }
        if (dislikeMap[i] > maxDislike) { maxDislike = dislikeMap[i]; maxDislikeSec = i; }
      }

      // 更新概览
      document.getElementById('totalCount').textContent = data.length;
      document.getElementById('bestPoint').textContent = `第${maxLikeSec}秒 (${maxLike}票)`;
      document.getElementById('worstPoint').textContent = `第${maxDislikeSec}秒 (${maxDislike}票)`;

      // 渲染表格
      renderFeedbackTable();
    }

    function renderFeedbackTable() {
      const tbody = document.getElementById('feedbackTable');
      tbody.innerHTML = feedbackSummary.map(item => `
        <tr>
          <td>${item.second}s</td>
          <td>${item.like}</td>
          <td>${item.dislike}</td>
        </tr>
      `).join('');
    }

    // 导出反馈CSV
    function exportFeedbackCSV() {
      let csv = '视频秒数,好看人数,不好看人数\n';
      feedbackSummary.forEach(item => {
        csv += `${item.second},${item.like},${item.dislike}\n`;
      });
      downloadCSV(csv, '视频反馈数据.csv');
    }

    // 加载评价数据
    async function loadAnswersData() {
      const { data } = await supabase
        .from('form_answers')
        .select('*')
        .eq('video_id', 'default');
      
      if (!data) return;
      answersData = data;

      const count = data.length;
      document.getElementById('answerCount').textContent = count;

      if (count === 0) return;

      // 平均时长
      const avgDur = Math.round(data.reduce((sum, item) => sum + (item.total_duration || 0), 0) / count);
      document.getElementById('avgDuration').textContent = avgDur + '秒';

      // 整体平均分
      const avgScore = (data.reduce((sum, item) => sum + (item.q1_score1 || 0), 0) / count).toFixed(1);
      document.getElementById('avgScore').textContent = avgScore + '分';

      // 各维度平均分
      const dims = ['整体评价', '画面质量', '音乐/音效', '搞笑程度', '节奏把控'];
      const scoreFields = ['q1_score1', 'q1_score2', 'q1_score3', 'q1_score4', 'q1_score5'];
      let scoreHtml = '';
      dims.forEach((dim, idx) => {
        const avg = (data.reduce((sum, item) => sum + (item[scoreFields[idx]] || 0), 0) / count).toFixed(1);
        scoreHtml += `<div class="poll-item"><span>${dim}</span><span>${avg}分</span></div>`;
      });
      document.getElementById('scoreStats').innerHTML = scoreHtml;

      // 标题投票统计
      const titleCount = {};
      data.forEach(item => {
        const key = item.q3_choice || '未填写';
        titleCount[key] = (titleCount[key] || 0) + 1;
      });
      document.getElementById('titlePollStats').innerHTML = Object.entries(titleCount)
        .map(([k,v]) => `<div class="poll-item"><span>${k}</span><span>${v}票</span></div>`).join('');

      // 封面投票统计
      const coverCount = {};
      data.forEach(item => {
        const key = item.q4_choice || '未填写';
        coverCount[key] = (coverCount[key] || 0) + 1;
      });
      document.getElementById('coverPollStats').innerHTML = Object.entries(coverCount)
        .map(([k,v]) => `<div class="poll-item"><span>${k}</span><span>${v}票</span></div>`).join('');

      // 建议汇总
      const suggestionHtml = data
        .filter(item => item.q5_suggestion)
        .map(item => `<tr><td>${new Date(item.created_at).toLocaleString()}</td><td>${item.q5_suggestion}</td></tr>`)
        .join('');
      document.getElementById('suggestionTable').innerHTML = suggestionHtml;
    }

    // 导出评价CSV
    function exportAnswersCSV() {
      const headers = '提交时间,用户ID,总作答时长,整体评分,画面评分,音效评分,搞笑评分,节奏评分,低分原因,标题选择,标题自定义,封面选择,封面自定义,总体建议,第1题时长,第2题时长,第3题时长,第4题时长,第5题时长\n';
      let csv = headers;
      answersData.forEach(item => {
        csv += [
          new Date(item.created_at).toLocaleString(),
          item.user_id,
          item.total_duration,
          item.q1_score1,
          item.q1_score2,
          item.q1_score3,
          item.q1_score4,
          item.q1_score5,
          item.q2_reasons,
          item.q3_choice,
          item.q3_other,
          item.q4_choice,
          item.q4_other,
          item.q5_suggestion,
          item.q1_duration,
          item.q2_duration,
          item.q3_duration,
          item.q4_duration,
          item.q5_duration
        ].join(',') + '\n';
      });
      downloadCSV(csv, '视频评价完整数据.csv');
    }

    // 通用下载CSV
    function downloadCSV(content, filename) {
      const blob = new Blob(['\ufeff' + content], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // 回车登录
    document.getElementById('passwordInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') login();
    });
// 危险操作：清空全部业务数据（保留配置与管理员密码）
async function clearAllBusinessData(){
  const tip1 = "⚠️警告：该操作会永久删除：全部秒级反馈数据 + 全部用户答卷记录\n配置、管理员密码不会被删除。\n建议先导出CSV做好备份！\n确定继续吗？";
  if(!confirm(tip1)) return;

  const tip2 = "再次确认！删除后数据无法找回，确定清空？";
  if(!confirm(tip2)) return;

  try{
    // 删除feedback全部记录
    const {error:err1} = await supabase
      .from('feedback')
      .delete()
      .neq('id',0); // 条件恒真，删除全部

    // 删除form_answers全部记录
    const {error:err2} = await supabase
      .from('form_answers')
      .delete()
      .neq('id',0);

    if(err1 || err2){
      alert("清空失败！请检查数据库表RLS权限是否允许删除");
      console.error(err1,err2);
      return;
    }

    alert("✅全部业务数据已经清空！页面即将刷新");
    // 重新加载后台数据
    await loadFeedbackData();
    await loadAnswersData();
  }catch(e){
    alert("执行异常："+e.message);
  }
}

    // 兼容 HTML onclick 调用：确保所有按钮事件函数挂载到 window
    window.switchTab = switchTab;
    window.toggleFeedback = toggleFeedback;
    window.saveProjectConfig = saveProjectConfig;
    window.saveContentConfig = saveContentConfig;
    window.changePassword = changePassword;
    window.clearAllBusinessData = clearAllBusinessData;
    // Cloudflare Pages compatibility: bind login without inline onclick
    document.addEventListener('DOMContentLoaded', function() {
      const btn = document.getElementById('loginBtn');
      if (btn) btn.addEventListener('click', window.login);
    });

  </script>
